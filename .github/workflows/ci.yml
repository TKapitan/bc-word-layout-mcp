# Build + test on Windows AND Linux (release plan G5). The Linux leg is a rot-guard, not a support
# claim (D8): it keeps the [SupportedOSPlatform]-guarded non-Windows code paths compiling and their
# dependency-agnostic tests passing, so widening platform support later stays a day's work. Warnings
# fail the build (TreatWarningsAsErrors + latest-recommended analyzers in Directory.Build.props).
#
# Every change runs both legs, documentation-only ones included: the suite reads README.md, both skills
# and the other docs it guards against drift, so a Markdown-only PR can break it as surely as a code
# change. An earlier Markdown-only skip let such a PR merge green and fail the next code PR instead
# (GitHub issue #107).
#
# The ruleset's ONLY required status check is `ci-result`, an always-run gate that fails unless every
# job it depends on succeeded. Requiring that one stable name, rather than each matrix leg's
# `build-and-test (<os>)` context, keeps the ruleset unchanged when a leg or a job is added or renamed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the default GITHUB_TOKEN, declared here rather than left to the repository
# setting (CodeQL actions/missing-workflow-permissions). The repo default is already read-only, but
# declaring it documents what these jobs actually need and keeps the token restricted if the repo
# ever moves under an organization whose default is read-write. release.yml declares its own wider
# permissions on the job that needs them.
permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      # The Python tooling (corpus scrubber, e2e and release harnesses) is standard-library only, so
      # its tests need nothing installed; once is enough, on the Linux leg.
      - name: Python tool tests
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tools/tests -v

  # The release artifacts, built and smoke-tested exactly as release.yml does before it publishes
  # (scripts/build-release-zips.ps1, then scripts/smoke-release-artifacts.ps1), so a packaging problem
  # fails the pull request that causes it instead of the tag that would have shipped it (GitHub issue
  # #110). A job of its own, so it runs in parallel with the test legs.
  package-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Pack NuGet packages
        run: dotnet pack src/BcWordLayout.McpHost -c Release -o artifacts/nupkg

      - name: Build release zips + checksums
        run: pwsh scripts/build-release-zips.ps1

      - name: Smoke-test the artifacts
        run: pwsh scripts/smoke-release-artifacts.ps1

  # The single required status check (see the header comment). `if: always()` makes it report on every
  # run, so a failed or cancelled leg fails it instead of leaving it pending.
  ci-result:
    needs: [build-and-test, package-smoke]
    if: always()
    permissions: {}   # reads the needs context only; never checks out
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        shell: bash
        run: |
          tests='${{ needs.build-and-test.result }}'
          smoke='${{ needs.package-smoke.result }}'
          echo "build-and-test: $tests, package-smoke: $smoke"
          [ "$tests" = "success" ] && [ "$smoke" = "success" ]
