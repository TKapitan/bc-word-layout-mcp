# Build + test on Windows AND Linux (release plan G5). The Linux leg is a rot-guard, not a support
# claim (D8): it keeps the [SupportedOSPlatform]-guarded non-Windows code paths compiling and their
# dependency-agnostic tests passing, so widening platform support later stays a day's work. Warnings
# fail the build (TreatWarningsAsErrors + latest-recommended analyzers in Directory.Build.props).
#
# Markdown-only changes skip both build legs: the `changes` job diffs the push/PR range and
# `build-and-test` runs only when something other than *.md changed. On any doubt (unresolvable
# base commit), the detection fails open and builds.
#
# The ruleset's ONLY required status check is `ci-result`, an always-run gate that fails unless
# the legs succeeded or were skipped by the Markdown-only rule. The matrix legs cannot be required
# directly alongside the skip: a matrix job skipped by `if:` never expands its matrix, so on a
# docs PR GitHub reports a single check named `build-and-test` and the required contexts
# `build-and-test (windows-latest)` / `(ubuntu-latest)` stay "Expected" forever, blocking the
# merge. (A workflow-level paths-ignore has the same stuck-"Expected" problem, which is why the
# skip is a job-level `if:` in the first place.)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect non-Markdown changes
        id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No resolvable base commit ('$base') - failing open, building everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base"...HEAD)
          echo "Changed files since $base:"
          echo "$changed"
          if echo "$changed" | grep -qivE '^$|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Markdown-only change - skipping the build legs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

  # The single required status check (see the header comment). `if: always()` makes it report on
  # every run; it passes only when both legs succeeded, or were skipped because nothing outside
  # Markdown changed. Any other combination — a failed leg, a failed/cancelled `changes` job — fails.
  ci-result:
    needs: [changes, build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify the build legs succeeded or were legitimately skipped
        shell: bash
        run: |
          result='${{ needs.build-and-test.result }}'
          code='${{ needs.changes.outputs.code }}'
          echo "build-and-test: $result (non-Markdown changes: $code)"
          if [ "$result" = "success" ]; then exit 0; fi
          if [ "$result" = "skipped" ] && [ "$code" = "false" ]; then exit 0; fi
          exit 1
