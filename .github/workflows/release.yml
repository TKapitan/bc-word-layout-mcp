# Release on a v* tag (see docs/RELEASING.md): tag-vs-version guard, full test gate, then pack +
# push EVERY produced
# .nupkg (the top-level BcWordLayout.Mcp manifest package plus one per RID — all must ship together),
# build the Channel-B zips + checksums via the same script a local rehearsal uses, and create the
# GitHub Release with the zips, SHA256SUMS.txt, and install.ps1 as assets (the README's
# releases/latest/download/install.ps1 one-liner depends on that last asset). A tag containing '-'
# (e.g. v1.0.0-rc.1) is marked as a pre-release.
#
# NuGet publishing uses TRUSTED PUBLISHING (OIDC), not a stored API key: the job's GitHub OIDC token
# is exchanged for a 1-hour NuGet API key against the Trusted Publishing policy configured on
# nuget.org (owner TKapitan, repository bc-word-layout-mcp, workflow file release.yml). The only
# secret is NUGET_USER — the nuget.org profile name (NOT an email, NOT a key). The login step sits
# directly before the push because the exchanged key expires after an hour.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # GitHub OIDC token for NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      # The tag is the trigger but Directory.Build.props is the version source — if they disagree,
      # the workflow would pack and publish packages for a DIFFERENT (immutable, unreclaimable)
      # version than the tag claims. Fail here, before the test gate, instead. Release candidates
      # therefore need a real version bump (1.0.0-rc.N in Directory.Build.props + the three
      # manifests) just like final releases; PackagingMetadataTests keeps the manifests in sync
      # with the props, and this step keeps the tag in sync with the props.
      - name: Verify the tag matches the manifest version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $version = (Select-Xml -Path Directory.Build.props -XPath '/Project/PropertyGroup/Version').Node.InnerText
          if ($tag -ne $version) {
            throw "Tag version '$tag' does not match <Version>$version</Version> in Directory.Build.props. Bump the version (see docs/RELEASING.md) or fix the tag."
          }

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test (full gate)
        run: dotnet test -c Release

      - name: Pack NuGet packages
        run: dotnet pack src/BcWordLayout.McpHost -c Release

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Enumerate in pwsh and push per file: `dotnet nuget push` does not resolve forward-slash
      # wildcards on Windows (the rc.1 run failed with 'File does not exist' on the glob), and the
      # count assertion enforces that the manifest package and both RID packages ship together.
      - name: Push every package to NuGet
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem src/BcWordLayout.McpHost/bin/Release/*.nupkg)
          if ($packages.Count -ne 3) {
            throw "Expected 3 packages (BcWordLayout.Mcp + win-x64 + win-arm64), found $($packages.Count): $($packages.Name -join ', ')"
          }
          foreach ($pkg in $packages) {
            dotnet nuget push $pkg.FullName --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Push failed for $($pkg.Name)" }
          }

      - name: Build release zips + checksums
        run: pwsh scripts/build-release-zips.ps1

      - name: Create the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $assets = Get-ChildItem artifacts/release/* | ForEach-Object FullName
          $flags = @('--title', $tag, '--verify-tag', '--generate-notes')
          if ($tag.Contains('-')) { $flags += '--prerelease' }
          gh release create $tag @assets @flags
